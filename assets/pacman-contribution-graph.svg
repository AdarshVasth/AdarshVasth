      <circle cx="9.5" cy="8" r="1.5" fill="#b71c1c"/>
      <circle cx="16" cy="8" r="3" fill="#ffffff"/>
      <circle cx="17.5" cy="8" r="1.5" fill="#b71c1c"/>
    </g>

    <!-- Pac-Man Chomping -->
    <g transform="translate(125, 70)" filter="url(#glowLight)">
      <path d="M 0,0 L 18,-14 A 20,20 0 1,0 18,14 Z" fill="#fbc02d">
        <animate attributeName="d" values="M 0,0 L 18,-14 A 20,20 0 1,0 18,14 Z; M 0,0 L 20,-2 A 20,20 0 1,0 20,2 Z; M 0,0 L 18,-14 A 20,20 0 1,0 18,14 Z" dur="0.3s" repeatCount="indefinite"/>
