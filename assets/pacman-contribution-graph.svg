  <!-- Pac-Man and Ghosts Animated Group Moving Across Grid -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-150 0; 920 0" dur="12s" repeatCount="indefinite"/>

    <!-- Inky (Cyan Ghost) -->
    <g transform="translate(0, 58)">
      <path d="M 0,20 C 0,5 6,0 12,0 C 18,0 24,5 24,20 L 24,24 L 20,20 L 16,24 L 12,20 L 8,24 L 4,20 L 0,24 Z" fill="#00b0ff"/>
      <circle cx="8" cy="8" r="3" fill="#ffffff"/>
      <circle cx="9.5" cy="8" r="1.5" fill="#0d47a1"/>
      <circle cx="16" cy="8" r="3" fill="#ffffff"/>
      <circle cx="17.5" cy="8" r="1.5" fill="#0d47a1"/>
    </g>

    <!-- Pinky (Pink Ghost) -->
    <g transform="translate(35, 58)">
      <path d="M 0,20 C 0,5 6,0 12,0 C 18,0 24,5 24,20 L 24,24 L 20,20 L 16,24 L 12,20 L 8,24 L 4,20 L 0,24 Z" fill="#f06292"/>
