  </svg>

  <!-- Commits -->
  <svg x="360" y="0" width="110" height="110" viewBox="0 0 110 110" fill="none">
    <rect x="0.5" y="0.5" rx="4.5" width="109" height="109" fill="#23272A" fill-opacity="0"/>
