    <text x="50%" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="13" fill="#7289DA">Stars</text>
    <text x="50%" y="85" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="10.5" fill="#FFFFFF">Stargazer</text>
    <text x="50%" y="97" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF">7 Stars</text>
    <rect x="15" y="101" rx="1" width="80" height="3.2" opacity="0.3" fill="#5865F2"/>
