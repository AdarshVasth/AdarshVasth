    <text x="50%" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="13" fill="#7289DA">Commits</text>
    <text x="50%" y="85" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="10.5" fill="#FFFFFF">High Committer</text>
