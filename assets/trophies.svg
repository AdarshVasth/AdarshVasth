    <text x="50%" y="85" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="10.5" fill="#FFFFFF">Repo Creator</text>
    <text x="50%" y="97" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF">25+ repos</text>
