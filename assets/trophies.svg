    <text x="50%" y="85" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="10.5" fill="#FFFFFF">Village Elder</text>
    <text x="50%" y="97" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF">1years</text>
    <rect x="15" y="101" rx="1" width="80" height="3.2" opacity="0.3" fill="#5865F2"/>
    <rect id="LongTimeUser-rank-progress" x="15" y="101" rx="1" height="3.2" fill="#5865F2"/>
  </svg>

  <!-- NewUser -->
  <svg x="240" y="0" width="110" height="110" viewBox="0 0 110 110" fill="none">
