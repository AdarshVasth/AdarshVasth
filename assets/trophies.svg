      <path d="M7 10h2v4H7v-4z"/><path d="M10 11c0 .552-.895 1-2 1s-2-.448-2-1 .895-1 2-1 2 .448 2 1z"/><circle cx="8" cy="6" r="4" fill="#FFFFFF" /><text x="6" y="8" font-family="Courier, Monospace" font-size="7" fill="#000000">A</text>
