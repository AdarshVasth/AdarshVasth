  <!-- Followers -->
  <svg x="720" y="0" width="110" height="110" viewBox="0 0 110 110" fill="none">
    <rect x="0.5" y="0.5" rx="4.5" width="109" height="109" fill="#23272A" fill-opacity="0"/>
    <svg x="28" y="20" width="100" height="100" viewBox="0 0 30 30" fill="url(#STAR_GRAD)">
      <circle cx="8" cy="6" r="4" fill="#FFFFFF" /><text x="6" y="8" font-family="Courier, Monospace" font-size="7" fill="#000000">C</text>
    </svg>
    <text x="50%" y="18" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="13" fill="#7289DA">Followers</text>
    <text x="50%" y="85" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="10.5" fill="#FFFFFF">Community</text>
    <text x="50%" y="97" text-anchor="middle" font-family="Segoe UI,sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF">Active</text>
